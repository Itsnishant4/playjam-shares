    let currentFolder = 'all';

    function init() {
      applyFilters();
    }

    function selectFolder(folder) {
      currentFolder = folder;
      
      document.querySelectorAll('.folder-btn').forEach(btn => {
        if (btn.dataset.folder === folder) {
          btn.classList.add('bg-slate-200', 'text-slate-900', 'font-semibold');
        } else {
          btn.classList.remove('bg-slate-200', 'text-slate-900', 'font-semibold');
        }
      });

      const allBtn = document.getElementById('nav-all-jams');
      if (folder === 'all') {
        allBtn.classList.add('active');
        document.getElementById('header-title').innerText = 'All Jams';
      } else {
        allBtn.classList.remove('active');
        document.getElementById('header-title').innerText = folder;
      }

      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById('jam-search').value.toLowerCase();
      const typeFilter = document.getElementById('filter-type').value;
      const creatorFilter = document.getElementById('filter-creator').value;

      const filtered = testRuns.filter(t => {
        const matchFolder = (currentFolder === 'all') || (t.folder === currentFolder);
        const matchQuery = t.title.toLowerCase().includes(q) || t.folder.toLowerCase().includes(q) || (t.author && t.author.toLowerCase().includes(q));
        const matchType = (typeFilter === 'all') || (t.type === typeFilter);
        const matchCreator = (creatorFilter === 'all') || (t.author === creatorFilter);
        return matchFolder && matchQuery && matchType && matchCreator;
      });

      document.getElementById('active-count').innerText = filtered.length;
      renderCards(filtered);
    }

    function renderCards(cards) {
      const grid = document.getElementById('jams-grid');
      const emptyState = document.getElementById('empty-state');
      grid.innerHTML = '';

      if (cards.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      cards.forEach(card => {
        const item = document.createElement('div');
        item.className = `test-card flex flex-col rounded-xl border bg-white overflow-hidden cursor-pointer shadow-2xs group ${card.status === 'FAILED' ? 'border-red-300' : 'border-slate-200/80'}`;
        item.onclick = () => window.location.href = card.reportUrl;

        const initials = (card.author || 'NP').slice(0, 2).toUpperCase();

        item.innerHTML = `
          <!-- Video Thumbnail Container -->
          <div class="relative w-full aspect-[16/10] bg-slate-950 overflow-hidden flex items-center justify-center">
            <img src="${card.thumbnailUrl}" class="w-full h-full object-cover group-hover:scale-103 transition duration-300">
            
            <!-- Top Author / Device Badge -->
            <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5 bg-black/50 backdrop-blur-sm px-2 py-0.5 rounded-full text-white text-[11px] font-medium whitespace-nowrap">
              <div class="w-4 h-4 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-[8px] uppercase">
                ${initials}
              </div>
              <span class="text-slate-100 truncate max-w-[140px]">${card.author}</span>
            </div>

            ${card.status === 'FAILED' ? `<div class="absolute top-2.5 right-2.5 bg-red-600 text-white px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wide shadow-sm whitespace-nowrap">FAILED</div>` : ''}

            <!-- Bottom Duration Pill -->
            <div class="absolute bottom-2.5 right-2.5 bg-black/80 backdrop-blur-sm px-2 py-0.5 rounded-md text-white text-[11px] font-medium flex items-center gap-1 shadow-sm whitespace-nowrap">
              <span>▶</span>
              <span>${card.durationFormatted}</span>
            </div>
          </div>

          <!-- Card Details Footer (Strict Single-Line No Wrapping) -->
          <div class="p-3.5 flex items-center justify-between gap-3 bg-white min-w-0">
            <div class="space-y-1 flex-1 min-w-0">
              <h3 class="text-xs font-semibold text-slate-900 truncate whitespace-nowrap group-hover:text-blue-600 transition block" title="${card.title}">
                ${card.title}
              </h3>
              <div class="flex items-center gap-1.5 text-[11px] text-slate-500 whitespace-nowrap overflow-hidden text-ellipsis">
                <span class="${card.status === 'FAILED' ? 'text-red-600' : 'text-emerald-700'} font-semibold shrink-0">${card.status}</span>
                <span class="text-slate-300 shrink-0">•</span>
                <span class="text-blue-600 font-medium shrink-0">${card.apiCount} APIs</span>
                <span class="text-slate-300 shrink-0">•</span>
                <span class="text-slate-500 shrink-0">${card.stepCount} Steps</span>
                <span class="text-slate-300 shrink-0">•</span>
                <span class="px-1.5 py-0.2 rounded bg-slate-100 text-slate-600 text-[10px] truncate max-w-[110px]">${card.folder}</span>
              </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              ${card.shareUrl ? `<a href="${card.shareUrl}" target="_blank" onclick="event.stopPropagation()" class="w-6 h-6 rounded-full bg-blue-50 hover:bg-blue-100 text-blue-600 flex items-center justify-center text-[11px] transition" title="Open shared link">🔗</a>` : ''}
              <span class="text-[11px] font-medium text-slate-400 whitespace-nowrap">
                ${card.dateFormatted}
              </span>
            </div>
          </div>
        `;
        grid.appendChild(item);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
