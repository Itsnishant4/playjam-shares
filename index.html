    let currentFolder = 'all';

    function init() {
      applyFilters();
    }

    function selectFolder(folder) {
      currentFolder = folder;
      
      document.querySelectorAll('.folder-btn').forEach(btn => {
        if (btn.dataset.folder === folder) {
          btn.classList.add('bg-slate-200', 'text-slate-900', 'font-semibold');
        } else {
          btn.classList.remove('bg-slate-200', 'text-slate-900', 'font-semibold');
        }
      });

      const allBtn = document.getElementById('nav-all-jams');
      if (folder === 'all') {
        allBtn.classList.add('active');
        document.getElementById('header-title').innerText = 'All Jams';
      } else {
        allBtn.classList.remove('active');
        document.getElementById('header-title').innerText = folder;
      }

      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById('jam-search').value.toLowerCase();
      const typeFilter = document.getElementById('filter-type').value;
      const creatorFilter = document.getElementById('filter-creator').value;

      const filtered = testRuns.filter(t => {
        const matchFolder = (currentFolder === 'all') || (t.folder === currentFolder);
        const matchQuery = t.title.toLowerCase().includes(q) || t.folder.toLowerCase().includes(q) || (t.author && t.author.toLowerCase().includes(q));
        const matchType = (typeFilter === 'all') || (t.type === typeFilter);
        const matchCreator = (creatorFilter === 'all') || (t.author === creatorFilter);
        return matchFolder && matchQuery && matchType && matchCreator;
      });

      document.getElementById('active-count').innerText = filtered.length;
      renderCards(filtered);
    }

    function renderCards(cards) {

      const emptyState = document.getElementById('empty-state');

            <!-- Top Author / Device Badge -->

            </div>

            ${card.status === 'FAILED' ? `<div class="absolute top-2.5 right-2.5 bg-red-600 text-white px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wide shadow-sm whitespace-nowrap">FAILED</div>` : ''}

            <div class="space-y-1 flex-1 min-w-0">

            </div>

            <div class="flex items-center gap-2 shrink-0">
              ${card.shareUrl ? `<a href="${card.shareUrl}" target="_blank" onclick="event.stopPropagation()" class="w-6 h-6 rounded-full bg-blue-50 hover:bg-blue-100 text-blue-600 flex items-center justify-center text-[11px] transition" title="Open shared link">🔗</a>` : ''}
              <span class="text-[11px] font-medium text-slate-400 whitespace-nowrap">
                ${card.dateFormatted}
              </span>
            </div>
          </div>
        `;
        grid.appendChild(item);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
